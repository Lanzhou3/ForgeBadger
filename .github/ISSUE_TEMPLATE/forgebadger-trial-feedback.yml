name: ForgeBadger first-user trial feedback
description: Report a local ForgeBadger trial result with environment, diagnostics, and Copilot workflow evidence.
title: "[Trial]: "
labels:
  - trial-feedback
  - product-hardening
body:
  - type: markdown
    attributes:
      value: |
        Use this form for local first-user trial feedback. Review all attachments before sharing.
        Do not paste API keys, passwords, JWTs, attach tokens, private keys, unrelated project secrets, or the `forgebadger.token` value.
        If this is a general bug, use the ForgeBadger bug report template. If it may expose a vulnerability or secret, follow `SECURITY.md` instead of opening a public issue.

  - type: dropdown
    id: result
    attributes:
      label: Trial result
      options:
        - pass
        - pass with caveats
        - blocked
    validations:
      required: true

  - type: dropdown
    id: affected_surface
    attributes:
      label: Affected surface
      options:
        - onboarding
        - dependency
        - provider
        - platform
        - terminal
        - Copilot
        - Feishu
        - Project Manager
        - docs
        - other
    validations:
      required: true

  - type: dropdown
    id: startup_path
    attributes:
      label: Startup path
      options:
        - npm/CLI
        - source fallback
        - other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include commit/version, OS, shell, browser, Node, selected terminal runtime and actual tmux/psmux version, Claude Code, and optional OpenCode/Codex versions.
      value: |
        ForgeBadger version or commit:
        OS:
        Shell:
        Browser:
        node --version:
        Terminal runtime selected (tmux/psmux):
        Actual runtime version (`tmux -V` or `psmux -V`):
        claude --version:
        opencode --version, if checked:
        codex --version, if checked:
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: forgebadger doctor summary
      description: Summarize the redacted, read-only `forgebadger doctor` result and selected runtime mode. For a new state path, note whether it remained absent. Do not attach raw terminal transcripts.
      render: text
    validations:
      required: true

  - type: textarea
    id: startup_health
    attributes:
      label: Startup and health checks
      description: Include the exact startup command, Web URL, Gateway URL, and health check result.
      value: |
        Command:
        Web URL:
        Gateway URL:
        Gateway health envelope:
        /login result:
    validations:
      required: true

  - type: textarea
    id: core_trial
    attributes:
      label: Core trial path
      description: Summarize account, project/config, Claude Code session, browser terminal attach, input/output, resize, reconnect, stop, and restart recovery.
      value: |
        Account:
        Project/config:
        Claude Code session:
        Browser terminal attach:
        Input/output:
        Resize:
        Refresh/reconnect:
        Stop:
        Gateway/Web restart recovery:
    validations:
      required: true

  - type: textarea
    id: copilot
    attributes:
      label: Copilot workflow evidence
      description: Record the observed Copilot conversation and approval path. Do not run or attach a retired provider smoke harness.
      value: |
        Copilot route availability: observed / unavailable / blocked
        Copilot conversation lifecycle observed: yes / no / skipped
        Approval decision result, if exercised: approved / rejected / not exercised
        Feishu account/configuration result, if configured: accepted / rejected / not configured
        Visible Copilot blocker, if any:
        Confirmed no raw terminal input without approval: yes / no
    validations:
      required: true

  - type: dropdown
    id: mapped_requirement
    attributes:
      label: Mapped UX requirement
      description: Choose the closest Phase 3 requirement for the primary issue.
      options:
        - UX-01 dependency/runtime guidance
        - UX-02 provider/model/credential recovery
        - UX-03 Copilot conversation and approval state coherence
        - UX-04 reproducible feedback quality
        - UX-05 active-run monotonic ordering
        - UX-06 partial API/query failure recovery
        - UX-07 E2E mock/selector regression signal
        - REL-* release evidence caveat
        - other
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - dependency
        - provider
        - CLI
        - platform
        - Copilot
        - docs
        - E2E
        - other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: severity
      options:
        - blocker
        - high
        - medium
        - low
    validations:
      required: true

  - type: textarea
    id: caveat_owner
    attributes:
      label: Owner, disposition, and follow-up route
      description: Required for pass with caveats or blocked results. Also use this to justify no-action outcomes.
      value: |
        Owner:
        Disposition: gate-clearing evidence / preserved caveat / preserved blocker / product defect / docs or support gap / no action
        Follow-up route: issue #3 LIVE-PROVIDER / issue #4 WINDOWS-WSL / issue #5 FIRST-USER-FEEDBACK / FEISHU-BOT-WS evidence / new issue / next phase / no action
        Next action or no-action rationale:
        Evidence needed to move to pass:
    validations:
      required: true

  - type: textarea
    id: windows_wsl
    attributes:
      label: Windows or WSL evidence
      description: Record native Windows ConPTY + psmux or WSL + tmux evidence. Repository tests and Ubuntu CI do not clear the physical-host caveat.
      value: |
        Native Windows version:
        Native psmux version and ConPTY terminal result:
        WSL distribution/version:
        WSL tmux terminal trial result:
        Browser + real AI CLI lifecycle completed: yes / no / blocked
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics and browser evidence
      description: Attach redacted diagnostics when possible and include bounded console/network summaries. Do not attach raw logs, provider payloads, Feishu bodies, terminal transcripts, local databases, or .env files.
      value: |
        Diagnostics export attached: yes / no
        Browser console error summary:
        Browser network failure summary:
        Screenshots or notes, redacted:
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps for each issue
      description: Write one numbered list per issue. Include expected and actual behavior.
      value: |
        1.

        Expected:

        Actual:
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I reviewed this issue and attachments for secrets before submitting.
          required: true
        - label: Any API keys, passwords, JWTs, attach tokens, private keys, project secrets, and `forgebadger.token` values have been removed.
          required: true
        - label: I did not attach raw terminal transcripts, raw provider payloads, raw Feishu bodies, local databases, `.env` files, or private AI CLI config.
          required: true
